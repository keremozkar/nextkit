server {
  listen 43127;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA shell
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Kits React + Next galleries
  location /kits/ {
    try_files $uri $uri/ /kits/index.html;
  }
  location /kits-next/ {
    try_files $uri $uri/ /kits-next/index.html;
  }

  location ~* \.(html|css|js|jsx|tsx|ts|json|svg|png|jpe?g|gif|webp|woff2?|md|glb)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
    types {
      text/javascript js jsx ts tsx mjs;
      text/css css;
      application/json json;
      text/markdown md;
    }
  }

  gzip on;
  gzip_types text/css application/javascript application/json text/markdown image/svg+xml;
}
