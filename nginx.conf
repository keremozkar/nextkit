server {
  listen 43127;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Keep full mime map (do NOT override with a partial types{} block)
  include /etc/nginx/mime.types;
  default_type text/html;

  # SPA shell
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Kits React + Next galleries
  location /kits/ {
    try_files $uri $uri/ /kits/index.html;
  }
  location /kits-next/ {
    try_files $uri $uri/ /kits-next/index.html;
  }

  # Raw component sources — show inline (never force download)
  location /react-bits-src/ {
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(jsx|tsx|ts|md)$ {
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # JSON never cached by browsers/proxies (boot depends on fresh groups)
  location ~* \.(json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Type "application/json; charset=utf-8" always;
  }

  location ~* \.(html|css|js|mjs|svg|png|jpe?g|gif|webp|woff2?|glb)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=60";
  }

  gzip on;
  gzip_types text/css application/javascript application/json text/markdown image/svg+xml text/plain;
}
