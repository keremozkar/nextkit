server {
  listen 43127;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Extra source extensions for Copy (don't force download)
  types {
    text/html html htm;
    text/javascript js mjs jsx ts tsx;
    text/css css;
    application/json json;
    text/markdown md;
    text/plain txt;
  }

  # SPA shell
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Kits React + Next galleries
  location /kits/ {
    try_files $uri $uri/ /kits/index.html;
  }
  location /kits-next/ {
    try_files $uri $uri/ /kits-next/index.html;
  }

  # Raw component sources — inline, never attachment
  location /react-bits-src/ {
    default_type text/plain;
    add_header Content-Disposition "inline";
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(html|css|js|jsx|tsx|ts|json|svg|png|jpe?g|gif|webp|woff2?|md|glb)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
    add_header Content-Disposition "inline";
  }

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json text/markdown image/svg+xml text/plain;
}
