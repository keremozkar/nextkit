server {
  listen 43127;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  default_type text/html;

  # SPA shell — never cache HTML entry so asset hashes stay fresh
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Kits React gallery
  location = /kits/index.html {
    add_header Cache-Control "no-store" always;
  }
  location /kits/ {
    try_files $uri $uri/ /kits/index.html;
    add_header Cache-Control "no-store" always;
  }

  # Next kits
  location = /kits-next/index.html {
    add_header Cache-Control "no-store" always;
  }
  location /kits-next/ {
    try_files $uri $uri/ /kits-next/index.html;
  }

  location /react-bits-src/ {
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(jsx|tsx|ts|md)$ {
    default_type text/plain;
    charset utf-8;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(json)$ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Type "application/json; charset=utf-8" always;
  }

  # Hashed kit chunks are immutable; missing file must 404 (not fall back to HTML)
  location ~* ^/kits/assets/.+\.(js|css|map)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(html)$ {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location ~* \.(css|js|mjs|svg|png|jpe?g|gif|webp|woff2?|glb)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }

  gzip on;
  gzip_types text/css application/javascript application/json text/markdown image/svg+xml text/plain;
}
