server {
  listen 43127;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA shell
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Demo HTML/CSS/JS under /reels, /css-components, etc. — serve as static files
  location ~* \.(html|css|js|json|svg|png|jpe?g|gif|webp|woff2?|md)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  gzip on;
  gzip_types text/css application/javascript application/json text/markdown image/svg+xml;
}
